name: EDxKa CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t edxka:ci .

      - name: Start EDxKa container
        run: |
          docker run -d \
            --name edxka-test \
            -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            edxka:ci

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/health; then
              echo "EDxKa is healthy!"
              exit 0
            fi

            echo "Waiting for EDxKa..."
            sleep 2
          done

          echo "EDxKa failed to become healthy"
          docker logs edxka-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker stop edxka-test || true