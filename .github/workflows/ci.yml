name: EDxKa CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    name: Build, Test and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t edxka:ci .

      - name: Start EDxKa container
        run: |
          docker run -d \
            --name edxka-test \
            -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            edxka:ci

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/health; then
              echo "EDxKa is healthy!"
              exit 0
            fi

            echo "Waiting for EDxKa..."
            sleep 2
          done

          echo "EDxKa failed to become healthy"
          docker logs edxka-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker stop edxka-test || true

            - name: Tag image for GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/edxka"
          SHA_TAG="${GITHUB_SHA}"

          docker tag edxka:ci "$IMAGE_NAME:latest"
          docker tag edxka:ci "$IMAGE_NAME:$SHA_TAG"

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "SHA_TAG=$SHA_TAG" >> "$GITHUB_ENV"

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$SHA_TAG"