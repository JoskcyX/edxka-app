<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account — EDxKa</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="dot" style="width:16px;height:16px;background:#F7C6B2;top:14%;left:12%;"></div>
  <div class="dot" style="width:14px;height:14px;background:#BFE9DE;top:20%;right:10%;"></div>
  <div class="dot" style="width:16px;height:16px;background:#BFE9DE;bottom:16%;left:18%;"></div>
  <div class="dot" style="width:14px;height:14px;background:#F3E3AF;bottom:12%;right:16%;"></div>

  <div class="card auth-card">
    <a href="/" class="logo">EDx<span class="accent">Ka</span></a>
    <h2 style="margin:18px 0 4px;font-size:26px;">Create a tutor account</h2>
    <p class="muted" style="margin-bottom:26px;">Build quizzes and run live sessions with your class.</p>

    <form id="signupForm">
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
        <div class="help-text">At least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
      <div class="error-text hidden" id="errBox"></div>
    </form>

    <p class="text-center mt-24">
      <a href="/signin.html" style="color:var(--orange);font-weight:800;">Already have an account? Sign in</a>
    </p>
  </div>
</div>

<script src="/api.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('errBox');
  hideError(errBox);
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const { token, user } = await API.post('/api/auth/signup', { name, email, password });
    API.setToken(token);
    API.setUser(user);
    window.location.href = '/dashboard.html';
  } catch (err) {
    showError(errBox, err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
