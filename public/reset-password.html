<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set a new password — EDxKa</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="dot" style="width:16px;height:16px;background:#F7C6B2;top:14%;left:12%;"></div>
  <div class="dot" style="width:14px;height:14px;background:#BFE9DE;top:20%;right:10%;"></div>
  <div class="dot" style="width:16px;height:16px;background:#BFE9DE;bottom:16%;left:18%;"></div>

  <div class="card auth-card">
    <a href="/" class="logo">EDx<span class="accent">Ka</span></a>
    <h2 style="margin:18px 0 4px;font-size:26px;">Set a new password</h2>
    <p class="muted" style="margin-bottom:26px;" id="subtitle">Choose a new password for your account.</p>

    <form id="resetForm">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Update password</button>
      <div class="error-text hidden" id="errBox"></div>
      <div class="success-text hidden" id="okBox"></div>
    </form>
  </div>
</div>

<script src="/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const token = params.get('token');
const form = document.getElementById('resetForm');

if (!uid || !token) {
  document.getElementById('subtitle').textContent = 'This reset link looks incomplete.';
  form.classList.add('hidden');
  showError(document.getElementById('errBox'), 'Please request a new reset link.');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('errBox');
  const okBox = document.getElementById('okBox');
  hideError(errBox);
  okBox.classList.add('hidden');

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  if (password !== confirm) {
    showError(errBox, "Passwords don't match.");
    return;
  }

  btn.disabled = true; btn.textContent = 'Updating…';
  try {
    const data = await API.post('/api/auth/reset-password', { uid, token, newPassword: password });
    okBox.textContent = data.message || 'Password updated. You can sign in now.';
    okBox.classList.remove('hidden');
    form.querySelectorAll('input, button').forEach((el) => el.disabled = true);
    setTimeout(() => window.location.href = '/signin.html', 1600);
  } catch (err) {
    showError(errBox, err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Update password';
  }
});
</script>
</body>
</html>
