<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — EDxKa</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="dot" style="width:16px;height:16px;background:#F7C6B2;top:14%;left:12%;"></div>
  <div class="dot" style="width:14px;height:14px;background:#BFE9DE;top:20%;right:10%;"></div>
  <div class="dot" style="width:16px;height:16px;background:#BFE9DE;bottom:16%;left:18%;"></div>

  <div class="card auth-card">
    <a href="/" class="logo">EDx<span class="accent">Ka</span></a>
    <h2 style="margin:18px 0 4px;font-size:26px;">Forgot your password?</h2>
    <p class="muted" style="margin-bottom:26px;">
      Enter the email on your tutor account and we'll send a link to reset it.
    </p>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
      <div class="error-text hidden" id="errBox"></div>
      <div class="success-text hidden" id="okBox"></div>
    </form>

    <div id="devLinkBox" class="hidden mt-16" style="background:#F5F1E5;border-radius:12px;padding:14px 16px;font-size:13px;">
      <strong>Dev mode — no email server configured.</strong>
      <p class="mt-8" style="margin-bottom:8px;">Here's the reset link that would have been emailed:</p>
      <a id="devLink" href="#" style="word-break:break-all;color:var(--orange);font-weight:700;"></a>
    </div>

    <p class="text-center mt-24">
      <a href="/signin.html" style="color:var(--orange);font-weight:800;">← Back to sign in</a>
    </p>
  </div>
</div>

<script src="/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('errBox');
  const okBox = document.getElementById('okBox');
  hideError(errBox);
  okBox.classList.add('hidden');
  document.getElementById('devLinkBox').classList.add('hidden');

  const email = document.getElementById('email').value.trim();
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const data = await API.post('/api/auth/forgot-password', { email });
    okBox.textContent = data.message || 'If an account exists for that email, a reset link is on its way.';
    okBox.classList.remove('hidden');
    if (data.devResetLink) {
      const devLink = document.getElementById('devLink');
      devLink.href = data.devResetLink;
      devLink.textContent = data.devResetLink;
      document.getElementById('devLinkBox').classList.remove('hidden');
    }
  } catch (err) {
    showError(errBox, err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
});
</script>
</body>
</html>
